<section class=s><div class=sh><h2>What we&rsquo;ll do</h2><span class=sc>Supply, hang &amp; finish</span></div><ul class=do>

<li>Mold-resistant 1/2&Prime; board on the bath walls, about 12 boards.</li>

<li>Daily tidy-up, haul-away of scrap and a broom-swept floor at the end.</li></ul></section>
